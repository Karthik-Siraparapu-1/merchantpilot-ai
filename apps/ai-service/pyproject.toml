[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "merchantpilot-ai-service"
version = "0.1.0"
description = "MerchantPilot AI inference service boundary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/merchantpilot_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
